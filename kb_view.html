rgin-top:4px}.answer-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;background:#f8faf9}.source-page{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}.source-page summary{cursor:pointer;padding:10px 12px;font-size:12px;background:#f8faf9}.source-page .source-body{padding:10px}.source-page a{font-size:12px;display:inline-block;margin-bottom:8px}.source-page img{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--line)}.page-error{font-size:12px;color:var(--amber);padding:9px;background:var(--warn)}.placeholder{padding:65px 28px;text-align:center;color:var(--muted)}.placeholder .symbol{font-size:38px;color:#a2bbb0;margin-bottom:12px}.placeholder h2{font-size:18px;font-weight:600;color:var(--ink)}.placeholder p{font-size:13px;line-height:1.9}.footer{font-size:11px;color:var(--muted);padding:0 25px 20px;text-align:center}

<body>
<header class="masthead">
 <div class="brandrow"><div><div class="eyebrow">SCIENCE / LOCAL LIBRARY</div><h1>化学知识库 <span>知识 · 题目 · 原书页</span></h1></div><div class="offline">● 离线可用</div></div>
 <div id="coverage" class="coverage" aria-label="OCR覆盖与核对状态"></div>
</header>
<div class="toolbar" role="search">
 <div class="search-field"><label for="search">全文检索</label><input id="search" type="search" placeholder="例如：钠 水 ／ 牛顿 第二定律 ／ 精讲册 第3页" autocomplete="off"></div>
 <div><label for="subject">学科</label><select id="subject"><option value="">全部学科</option></select></div>
 <div><label for="kind">内容类型</label><select id="kind"><option value="">全部类型</option></select></div>
 <button id="reset" class="reset" type="button">重置</button>
</div>
<div class="search-help">空格分隔多个词，结果须同时包含所有词。可搜索标题、正文和出处。快捷键：<kbd>/</kbd> 聚焦检索，<kbd>Esc</kbd> 清除检索。</div>
<main class="workspace">
 <aside class="panel nav-panel" aria-label="章节结构"><div class="panel-heading">按书中层级浏览</div><div class="nav-tools"><button id="all-items">全部条目</button><button id="all-pages">原书页</button></div><div id="tree" class="tree"></div><div class="tree-note">章节 / 小节是书中结构。知识和题目候选由 OCR 自动提取，需对照原页核对。</div></aside>
 <section class="panel results-panel" aria-label="检索结果"><div class="results-header"><strong id="result-count" aria-live="polite"></strong><span id="result-description">按相关度排序</span></div><div id="scope" class="scope" hidden></div><div id="results" class="results"></div><button id="more" class="more" hidden>继续显示</button></section>
 <section id="detail" class="panel detail-panel is-empty" aria-label="条目详情"><div class="placeholder"><div class="symbol">⌘</div><h2>从一个知识点开始</h2><p>检索知识或题目，点击结果查看正文、双向关系与原扫描页。<br>点击左侧章节，可限定本章范围。</p></div></section>
</main>
<footer id="footer" class="footer"></footer>
<script type="application/json" id="kb-data">__KB_DATA__</script>
<script>
'use strict';
const KB=JSON.parse(document.getElementById('kb-data').textContent);
const kinds={chapter:'章节',section:'小节',knowledge:'知识点',concept:'概念',law:'规律 / 定律',method:'方法',question:'题目',page:'原书页',answer:'答案'};
const relationNames={contains:'包含',belongs_to:'属于',parent:'上级',related:'相关',related_to:'相关',prerequisite:'前置知识',requires:'需要',uses:'运用',tests:'考查',examines:'考查',applies:'应用',explains:'解释',answers:'解答',has_answer:'配对答案',answer_of:'解答题目',solution:'解答',source:'出处',on_page:'所在原页',next:'下一项'};
const $=id=>document.getElementById(id);
const nodes=KB.nodes.map(n=>({...n,id:String(n.id),title:String(n.title||'未命名条目'),text:String(n.text||''),sources:Array.isArray(n.sources)?n.sources:[]}));
// All scan pages are browsable, even when their OCR is not yet available.
// These display-only entries are not counted as extracted knowledge nodes.
const knownImages=new Set(nodes.filter(n=>n.kind==='page').flatMap(n=>n.sources.map(s=>String(s.image||'').replace(/\\/g,'/'))));
for(const book of (Array.isArray(KB.stats?.books)?KB.stats.books:[])){
 const total=Math.min(5000,Math.max(0,Number(book.total??book.total_pages)||0));
 if(!book.subject||!book.book)continue;
 for(let page=1;page<=total;page++){
  const image=`pages/${book.subject}/${book.book}/p${String(page).padStart(3,'0')}.png`;
  if(knownImages.has(image))continue;
  nodes.push({id:`scan:${book.subject}:${book.book}:${page}`,subject:book.subject,kind:'page',title:`${book.book} · 扫描页 ${page}`,text:'',sources:[{book:book.book,page,image}],status:'scan_only',virtual:true});
 }
}
const byId=new Map(nodes.map(n=>[n.id,n]));
const edges=KB.edges.filter(e=>byId.has(String(e.from))&&byId.has(String(e.to))).map(e=>({...e,from:String(e.from),to:String(e.to)}));
const adjacency=new Map(nodes.map(n=>[n.id,[]]));
edges.forEach(e=>{adjacency.get(e.from).push(e);if(e.from!==e.to)adjacency.get(e.to).push(e)});
const children=new Map();nodes.forEach(n=>{if(n.parent&&byId.has(String(n.parent))){const p=String(n.parent);if(!children.has(p))children.set(p,[]);children.get(p).push(n)}});
const normalize=v=>String(v??'').normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim();
function answerText(n){if(typeof n.answer==='string')return byId.has(n.answer)?byId.get(n.answer).text:n.answer;if(n.answer&&typeof n.answer==='object'){const id=String(n.answer.id||n.answer.node||n.answer.node_id||'');return String(n.answer.text||(byId.has(id)?byId.get(id).text:''))}return ''}
const searchable=new Map(nodes.map(n=>[n.id,normalize([n.title,n.text,answerText(n),n.source_note||'',n.subject,kinds[n.kind],...n.sources.map(s=>`${s.book||''} ${s.page??''} 第${s.page??''}页 ${s.image||''}`)].join(' '))]));
let currentId=null,scopeId=null,limit=80,visible=[],backStack=[];
function element(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!=null)e.textContent=text;return e}
function append(parent,...children){children.forEach(c=>{if(c)parent.appendChild(c)});return parent}
function tag(text,className=''){return element('span','tag '+className,text)}
function isReviewed(value){return /^(verified|reviewed|confirmed|已核对|已确认)/i.test(String(value||''))}
function isCurated(value){return /人工整理|精编整理|curated/i.test(String(value||''))}
function stateTag(n){if(n.review_status)return tag(n.review_status,isReviewed(n.review_status)?'verified':'candidate');if(isReviewed(n.status))return tag('已核对','verified');if(n.kind==='chapter'||n.kind==='section')return tag(isCurated(n.status)?'书中结构 · 精编整理':'书中结构 · 待核对');if(n.kind==='page')return tag(n.text?'OCR 原文 · 待核对':'原扫描页 · 未 OCR');if(isCurated(n.status))return tag('精编整理');if(n.origin==='structured')return tag('机器整理 · 待核对','candidate');return tag('自动候选 · 待核对','candidate')}
function sourceText(n){return n.sources.map(s=>`${s.book||'来源未标注'} · 第${s.page??'?'}页`).filter((s,i,a)=>a.indexOf(s)===i).join('；')||'出处未记录'}
function formatNumber(n){return Number.isFinite(Number(n))?Number(n).toLocaleString('zh-CN'):'未统计'}
function coverage(){const s=KB.stats||{},books=Array.isArray(s.books)?s.books:[],pages=nodes.filter(n=>n.kind==='page');const total=s.total_pages??s.total??s.pages_total??(books.length?books.reduce((a,b)=>a+Number(b.total??b.total_pages??0),0):null);const done=s.ocr_pages??s.done??s.pages_ocr??s.ocr_done??(books.length?books.reduce((a,b)=>a+Number(b.done??b.ocr_pages??0),0):null);const line=element('div');append(line,element('strong','',`OCR 覆盖：${formatNumber(done)} / ${formatNumber(total)} 页`),document.createTextNode('　· 自动提取内容待核对'));const note=element('div','coverage-sub','仅已完成 OCR 的页面支持全文检索；其余页面可查看扫描图。扫描页码以文件页序为准，可能与书上印刷页码不同。');append($('coverage'),line,note);if(s.answer_matching)$('coverage').append(element('div','coverage-sub',`题目与答案结构配对：${formatNumber(s.answer_matching.matched)} 对 · 待核对`));if(s.structured)$('coverage').append(element('div','coverage-sub',`概念／规律／方法整理：${formatNumber(s.structured.loaded_sections)} / ${formatNumber(s.structured.total_sections)} 小节 · 机器内容待核对`));if(books.length){const d=element('details');append(d,element('summary','',`各册进度（${books.length} 册）`));const entries=element('div','book-stats');books.forEach(b=>entries.append(element('span','',`${b.subject||''} ${b.book||b.name||''}：${formatNumber(b.done??b.ocr_pages??0)} / ${formatNumber(b.total??b.total_pages)} 页`)));d.append(entries);$('coverage').append(d)}$('footer').textContent=`本地快照 · ${KB.nodes.length.toLocaleString()} 个已提取条目 · ${nodes.filter(n=>n.kind==='page').length.toLocaleString()} 张原扫描页 · ${edges.length.toLocaleString()} 条关系${s.updated||s.generated_at?' · 更新 '+(s.updated||s.generated_at):''} · OCR 与自动关系请以原书为准。`}
function tokens(){return normalize($('search').value).split(' ').filter(Boolean)}
function descendantIds(id){const found=new Set(),queue=[id];while(queue.length){const p=queue.pop();if(found.has(p))continue;found.add(p);(children.get(p)||[]).forEach(n=>queue.push(n.id))}return found}
function score(n,terms){const title=normalize(n.title);return terms.reduce((s,t)=>s+(title.includes(t)?10:0),0)+(n.kind==='page'?-2:n.kind==='chapter'||n.kind==='section'?-1:0)+(isCurated(n.status)?2:0)+(isReviewed(n.review_status||n.status)?3:0)}
function highlighted(text,terms){const frag=document.createDocumentFragment();if(!terms.length){frag.append(document.createTextNode(text));return frag}const expression=new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|'),'gi');let end=0;for(const match of text.matchAll(expression)){frag.append(document.createTextNode(text.slice(end,match.index)),element('mark','',match[0]));end=match.index+match[0].length}frag.append(document.createTextNode(text.slice(end)));return frag}
function snippet(n,terms){const answer=answerText(n),answerHit=terms.length&&answer&&terms.some(t=>normalize(answer).includes(t))&&!terms.some(t=>normalize(n.text).includes(t));const text=(answerHit?'答案 / 解析：'+answer:n.text).replace(/(?:^|\n)\s*#{1,6}\s+/g,'').replace(/\s+/g,' ').trim();if(!text)return n.kind==='page'?'此页尚无 OCR 文本，可展开原扫描页。':'此条目暂无正文，请查看原书页。';const first=terms.map(t=>normalize(text).indexOf(t)).filter(i=>i>=0).sort((a,b)=>a-b)[0]??0;let start=Math.max(0,first-35),end=start+145;const formula=/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$[^\n$]+?\$/g;for(const m of text.matchAll(formula)){const finish=m.index+m[0].length;if(start>m.index&&start<finish)start=m.index;if(end>m.index&&end<finish)end=finish}return(start?'…':'')+text.slice(start,end)+(text.length>end?'…':'')}
function highlightDOM(parent,terms){if(!terms.length)return;const walker=document.createTreeWalker(parent,NodeFilter.SHOW_TEXT),texts=[];while(walker.nextNode())if(!walker.currentNode.parentElement.closest('.katex'))texts.push(walker.currentNode);texts.forEach(node=>node.replaceWith(highlighted(node.textContent,terms)))}
function updateResults(reset=true){if(reset)limit=80;const ts=tokens(),scope=scopeId?descendantIds(scopeId):null;visible=nodes.filter(n=>(!$('subject').value||n.subject===$('subject').value)&&(!$('kind').value||n.kind===$('kind').value)&&(!scope||scope.has(n.id))&&ts.every(t=>searchable.get(n.id).includes(t))).sort((a,b)=>score(b,ts)-score(a,ts)||a.title.localeCompare(b.title,'zh-CN',{numeric:true}));$('result-count').textContent=`${visible.length.toLocaleString()} 条结果`;$('result-description').textContent=ts.length?'多词交集 · 按相关度排序':'知识 / 题目优先';$('results').replaceChildren();if(!visible.length)$('results').append(element('div','empty','没有匹配条目。试试减少检索词、切换类型，或取消章节范围。'));visible.slice(0,limit).forEach(n=>{const card=element('button','result-card'+(currentId===n.id?' selected':''));card.type='button';card.dataset.id=n.id;const top=element('div','result-top');append(top,tag(n.subject||'学科未标注','subject'),tag(kinds[n.kind]||n.kind),stateTag(n));const title=element('div','result-title');title.append(highlighted(n.title,ts));const summary=element('div','snippet');summary.innerHTML=safeMarkdown(snippet(n,ts));highlightDOM(summary,ts);append(card,top,title,summary,element('span','source-line',sourceText(n)));card.addEventListener('click',()=>openNode(n.id));$('results').append(card)});$('more').hidden=visible.length<=limit;$('more').textContent=`继续显示（已显示 ${Math.min(limit,visible.length)} / ${visible.length}）`;$('scope').hidden=!scopeId;$('scope').replaceChildren();if(scopeId){append($('scope'),element('span','',`章节范围：${byId.get(scopeId)?.title||scopeId}`));const clear=element('button','','取消');clear.addEventListener('click',()=>{scopeId=null;updateResults();renderTree()});$('scope').append(clear)}}

function renderTree(){const tree=$('tree');tree.replaceChildren();const structural=nodes.filter(n=>['chapter','section'].includes(n.kind)&&(!$('subject').value||n.subject===$('subject').value));const subjects=[...new Set(structural.map(n=>n.subject||'未分类'))];if(!structural.length)tree.append(element('div','tree-note','目前尚未提取章节结构，可从全文检索或原书页开始。'));const structureSet=new Set(structural.map(n=>n.id));const visited=new Set();function item(n,depth){if(visited.has(n.id)||depth>12)return null;visited.add(n.id);const kids=(children.get(n.id)||[]).filter(x=>structureSet.has(x.id));if(!kids.length){const b=element('button','tree-leaf'+(scopeId===n.id?' active':''),n.title);b.addEventListener('click',()=>selectScope(n.id));return b}const details=element('details');details.open=depth<1||Boolean(scopeId&&descendantIds(n.id).has(scopeId));const summary=element('summary');const b=element('button','',n.title);b.addEventListener('click',e=>{e.preventDefault();selectScope(n.id)});summary.append(b);details.append(summary);const branch=element('div','branch');kids.forEach(child=>{const entry=item(child,depth+1);if(entry)branch.append(entry)});details.append(branch);return details}subjects.forEach(s=>{tree.append(element('h3','',s));const roots=structural.filter(n=>(n.subject||'未分类')===s&&!structureSet.has(String(n.parent)));roots.forEach(n=>{const entry=item(n,0);if(entry)tree.append(entry)});structural.filter(n=>(n.subject||'未分类')===s&&!visited.has(n.id)).forEach(n=>{const entry=item(n,0);if(entry)tree.append(entry)})})}

function safeMarkdown(value){const formulas=[];let source=String(value||'').replace(/\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]|\\\(([\s\S]*?)\\\)|(?<!\\)\$([^\n$]+?)\$/g,(full,a,b,c,d)=>{const math=a??b??c??d,display=a!=null||b!=null;let html;try{html=window.katex?window.katex.renderToString(math,{displayMode:display,throwOnError:false,trust:false,strict:'ignore',maxExpand:1000}):`<code>${escapeHTML(full)}</code>`}catch(_){html=`<code>${escapeHTML(full)}</code>`}const i=formulas.push(html)-1;return `\uE000${i}\uE001`});source=escapeHTML(source);const inline=s=>s.replace(/\[\[([^\[\]\n]+)\]\]/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');const lines=source.split(/\r?\n/);let html='',paragraph=[],list=null,inCode=false,code=[];function flush(){if(paragraph.length){html+='<p>'+inline(paragraph.join('\n'))+'</p>';paragraph=[]}if(list){html+=`</${list}>`;list=null}}for(let i=0;i<lines.length;i++){const line=lines[i];if(/^\s*```/.test(line)){flush();if(inCode){html+='<pre><code>'+code.join('\n')+'</code></pre>';code=[]}inCode=!inCode;continue}if(inCode){code.push(line);continue}if(!line.trim()){flush();continue}const heading=line.match(/^\s*#{1,6}\s+(.+)/);if(heading){flush();html+='<h3>'+inline(heading[1])+'</h3>';continue}const li=line.match(/^\s*(?:([-*+])|\d+[.)])\s+(.+)/);if(li){if(paragraph.length){html+='<p>'+inline(paragraph.join('\n'))+'</p>';paragraph=[]}const kind=li[1]?'ul':'ol';if(list!==kind){if(list)html+=`</${list}>`;html+=`<${kind}>`;list=kind}html+='<li>'+inline(li[2])+'</li>';continue}if(/^&gt;\s?/.test(line)){flush();html+='<blockquote>'+inline(line.replace(/^&gt;\s?/,''))+'</blockquote>';continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){flush();const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());html+='<table><thead><tr>'+cells(line function textBlock(text){const block=element('div','text-content');block.innerHTML=safeMarkdown(text);return block}

function relationEvidence(e){if(typeof e.evidence==='string')return e.evidence;const list=Array.isArray(e.evidence)?e.evidence:[e.evidence];const bits=[];for(const s of list){if(!s)continue;if(typeof s==='string'){bits.push(s);continue}if(s.book)bits.push(`${s.book} 第${s.page??'?'}页`);if(s.keyword||s.term)bits.push('关键词：'+(s.keyword||s.term));if(s.inferred)bits.push('省略栏目按原书上下文补全');}if(e.type==='has_answer')bits.unshift('分册、章节、小节、题组及题号一致且两侧唯一');if(e.generator==='link_concepts:v1')bits.unshift('同科同章题干中出现完整术语');return [...new Set(bits)].join('；');}
function relationButton(target,e,direction){const b=nodeButton(target.id);b.className='relation-button';b.replaceChildren();append(b,element('span','relation-head',`${direction==='本条目'?'本条目':target.title} ${relationNames[e.type]||e.type||'关联'} → ${direction==='本条目'?target.title:'本条目'}`),element('span','relation-meta',`${target.subject||''} · ${kinds[target.kind]||target.kind}`));if(e.evidence){const evidence=relationEvidence(e);b.append(element('span','relation-meta','证据：'+evidence))}const review=e.review_status||e.status;b.append(tag(isReviewed(review)?'关系已核对':isCurated(e.status)?'精编关系 · 待核对':'自动关系 · 待核对',isReviewed(review)?'verified':'candidate'));return b}

function appendAnswerNode(box,id){const a=byId.get(String(id));if(!a)return;box.append(textBlock(a.text||''));const src=(a.sources||[]).map(s=>`${s.book||''} · 扫描第${s.page??'?'}页`).join('；');if(src)box.append(element('div','muted','解答来源：'+src));box.append(nodeButton(a.id,'查看答案原页与关联'));}
function showAnswers(n,container){if(n.kind!=='question')return;container.append(element('h3','section-title','答案 / 解析'));const box=element('div','answer-box');const answer=n.answer;let matched=false;if(answer){if(typeof answer==='string'&&byId.has(answer)){appendAnswerNode(box,answer);matched=true}else if(typeof answer==='string'){box.append(textBlock(answer));matched=true}else if(typeof answer==='object'){const id=String(answer.id||answer.node||answer.node_id||'');if(id&&byId.has(id)){appendAnswerNode(box,id);matched=true}else if(answer.text){box.append(textBlock(String(answer.text)));matched=true}}}const answerEdges=(adjacency.get(n.id)||[]).filter(e=>/^(answers|has_answer|answer_of|solution|解答|答案)$/.test(e.type||'')).filter(e=>byId.get(e.from===n.id?e.to:e.from)?.kind==='answer');answerEdges.forEach(e=>{const id=e.from===n.id?e.to:e.from;box.append(relationButton(byId.get(id),e,e.from===n.id?'本条目':'关联条目'));matched=true});if(!matched){box.append(element('div','','尚未配对答案'),element('div','muted','此状态不代表原书没有答案。请查看原页或在答案类型中检索。'))}else box.append(element('div','muted',isReviewed(n.review_status||n.status)?'校核状态：'+(n.review_status||'已核对'):isCurated(n.status)?'精编解答，请结合校核状态与原书阅读。':(n.answer_match_status||'自动配对（待核对）')+'：需对照原书确认。'));container.append(box)}
function openNode(id,history=true){id=String(id);const n=byId.get(id);if(!n)return;if(history&&currentId&&currentId!==id)backStack.push(currentId);currentId=id;const detail=$('detail');detail.classList.remove('is-empty');detail.replaceChildren();const head=element('div','detail-top'),tools=element('div','detail-tools');append(tools,element('span','muted','条目详情'));if(backStack.length){const back=element('button','','← 返回上一条');back.addEventListener('click',()=>openNode(backStack.pop(),false));tools.append(back)}head.append(tools);const title=element('h2','',n.title);title.id='detail-title';title.tabIndex=-1;head.append(title);const meta=element('div','meta');append(meta,tag(n.subject||'学科未标注','subject'),tag(kinds[n.kind]||n.kind),stateTag(n));head.append(meta);const ancestors=[],seen=new Set([id]);let cursor=n;while(cursor.parent&&byId.has(String(cursor.parent))&&!seen.has(String(cursor.parent))){cursor=byId.get(String(cursor.parent));seen.add(cursor.id);ancestors.unshift(cursor)}if(ancestors.length){const crumb=element('div','breadcrumb');ancestors.forEach((p,i)=>{if(i)crumb.append(document.createTextNode(' / '));crumb.append(nodeButton(p.id,p.title))});head.append(crumb)}detail.append(head);const content=element('div','detail-content');if(!isReviewed(n.review_status||n.status)&&!['chapter','section'].includes(n.kind))content.append(element('div','review-note',n.kind==='page'?(n.text?'此页 OCR 原文未经校对；公式、符号与题号可能识别有误。请展开扫描图核对。':'此页尚未完成 OCR，正文暂不可检索。下方可查看原扫描页。'):isCurated(n.status)?'此条目为精编整理；请结合条目的校核状态和原扫描页阅读。':'此条目为自动提取候选，内容、边界和关系尚待核对。请以原扫描页为准。'));content.append(textBlock(n.text||(n.kind==='page'?'此页尚未完成 OCR，可查看原扫描页。':'暂无正文。')));showAnswers(n,content);const kidList=children.get(n.id)||[];if(kidList.length){content.append(element('h3','section-title',`本层级下的条目（${kidList.length}）`));kidList.slice(0,80).forEach(k=>{const b=nodeButton(k.id,`${kinds[k.kind]||k.kind} · ${k.title}`);b.className='relation-button';content.append(b)});if(kidList.length>80){const b=element('button','','在结果列表查看全部下级条目');b.addEventListener('click',()=>selectScope(n.id));content.append(b)}}const rels=adjacency.get(id)||[];content.append(element('h3','section-title',`双向关系（${rels.length}）`));if(!rels.length)content.append(element('p','muted','尚未记录关联关系。'));else rels.forEach(e=>{const outgoing=e.from===id;const target=byId.get(outgoing?e.to:e.from);content.append(relationButton(target,e,outgoing?'本条目':'关联条目'))});sourcePages(n,content);detail.append(content);detail.scrollTop=0;document.querySelectorAll('.result-card').forEach(card=>card.classList.toggle('selected',card.dataset.id===id));try{history&&window.history.replaceState(null,'','#'+encodeURIComponent(id))}catch(_){}if(window.innerWidth<901)detail.scrollIntoView({block:'start',behavior:'smooth'})}
function initialize(){coverage();[...new Set(nodes.map(n=>n.subject).filter(Boolean))].sort().forEach(s=>$('subject').append(new Option(s,s)));Object.entries(kinds).filter(([key])=>nodes.some(n=>n.kind===key)).forEach(([key,label])=>$('kind').append(new Option(label,key)));$('search').addEventListener('input',()=>updateResults());$('subject').addEventListener('change',()=>{scopeId=null;updateResults();renderTree()});$('kind').addEventListener('change',()=>updateResults());$('reset').addEventListener('click',()=>{$('search').value='';$('subject').value='';$('kind').value='';scopeId=null;updateResults();renderTree()});$('all-items').addEventListener('click',()=>{scopeId=null;$('kind').value='';updateResults();renderTree()});$('all-pages').addEventListener('click',()=>{scopeId=null;$('kind').value='page';updateResults();renderTree()});$('more').addEventListener('click',()=>{limit+=80;updateResults(false)});document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('search').focus()}if(e.key==='Escape'&&document.activeElement===$('search')){$('search').value='';updateResults()}});updateResults();renderTree();if(location.hash){try{openNode(decodeURIComponent(location.hash.slice(1)),false)}catch(_){}}}
